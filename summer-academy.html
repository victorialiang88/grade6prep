<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summer Academy 2025 — TAS Grade 6 Prep</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --surface: #151828;
    --surface2: #1e2235;
    --border: #2a2f4a;
    --accent-eng: #ff6b6b;
    --accent-sci: #4ecdc4;
    --accent-math: #ffe66d;
    --accent-hist: #a78bfa;
    --text: #e8eaf6;
    --text-dim: #7c82a8;
    --white: #ffffff;
    --radius: 16px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── NOISE OVERLAY ─── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  /* ─── HEADER ─── */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,15,26,0.9);
    backdrop-filter: blur(12px);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent-sci); }

  .header-right { display: flex; align-items: center; gap: 16px; }
  .xp-bar-wrap {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface);
    padding: 8px 16px;
    border-radius: 100px;
    border: 1px solid var(--border);
    font-size: 0.8rem;
  }
  .xp-bar { width: 100px; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--accent-sci), var(--accent-eng)); border-radius: 10px; transition: width 0.5s ease; }
  .xp-label { color: var(--accent-math); font-family: 'DM Mono', monospace; font-weight: 500; }

  /* ─── HERO ─── */
  .hero {
    padding: 60px 40px 40px;
    position: relative;
    overflow: hidden;
  }
  .hero-glow {
    position: absolute; top: -100px; left: -100px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(78,205,196,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-glow2 {
    position: absolute; top: -80px; right: -50px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(167,139,250,0.1) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1.5px;
    margin-bottom: 16px;
  }
  .hero h1 em { font-style: normal; color: var(--accent-sci); }
  .hero-sub {
    color: var(--text-dim);
    font-size: 1rem;
    max-width: 500px;
    line-height: 1.6;
    margin-bottom: 32px;
  }
  .hero-stats {
    display: flex; gap: 24px; flex-wrap: wrap;
  }
  .stat-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 0.85rem;
    display: flex; align-items: center; gap: 8px;
  }
  .stat-chip .dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ─── WEEK TABS ─── */
  .week-nav {
    display: flex; gap: 0;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .week-tab {
    padding: 14px 28px;
    border: none; background: none;
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    position: relative;
  }
  .week-tab:hover { color: var(--text); }
  .week-tab.active { color: var(--white); border-bottom-color: var(--accent-sci); }
  .week-tab .badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px;
    background: var(--accent-sci);
    color: var(--bg);
    border-radius: 50%;
    font-size: 0.65rem;
    font-weight: 700;
    margin-left: 6px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .week-tab.completed .badge { opacity: 1; background: #4caf50; }

  /* ─── MAIN LAYOUT ─── */
  .main {
    padding: 32px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .week-header {
    margin-bottom: 28px;
  }
  .week-label {
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    color: var(--accent-sci);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .week-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
  }

  /* ─── SUBJECT GRID ─── */
  .subjects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .subject-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
    cursor: pointer;
  }
  .subject-card:hover { transform: translateY(-2px); }
  .subject-card[data-subject="english"] { --color: var(--accent-eng); }
  .subject-card[data-subject="science"] { --color: var(--accent-sci); }
  .subject-card[data-subject="math"] { --color: var(--accent-math); }
  .subject-card[data-subject="history"] { --color: var(--accent-hist); }
  .subject-card:hover { border-color: var(--color); }

  .card-top {
    padding: 20px 20px 16px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .card-icon {
    width: 44px; height: 44px;
    background: color-mix(in srgb, var(--color) 15%, transparent);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.4rem;
  }
  .card-progress-ring { position: relative; }
  .card-top svg { transform: rotate(-90deg); }
  .ring-bg { stroke: var(--border); }
  .ring-fill { stroke: var(--color); stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.65rem;
    font-family: 'DM Mono', monospace;
    color: var(--color);
    font-weight: 500;
  }

  .card-body { padding: 0 20px 16px; }
  .card-subject-tag {
    display: inline-block;
    font-size: 0.65rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'DM Mono', monospace;
    color: var(--color);
    background: color-mix(in srgb, var(--color) 12%, transparent);
    padding: 3px 10px;
    border-radius: 100px;
    margin-bottom: 8px;
  }
  .card-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 12px;
  }

  .lessons-list { display: flex; flex-direction: column; gap: 8px; }
  .lesson-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    transition: all 0.2s;
    cursor: pointer;
  }
  .lesson-item:hover { border-color: var(--color); background: color-mix(in srgb, var(--color) 8%, var(--surface2)); }
  .lesson-status {
    width: 22px; height: 22px; flex-shrink: 0;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.7rem;
    transition: all 0.2s;
  }
  .lesson-item.done .lesson-status {
    background: var(--color);
    border-color: var(--color);
    color: var(--bg);
  }
  .lesson-item.active .lesson-status { border-color: var(--color); }
  .lesson-info { flex: 1; }
  .lesson-name { font-size: 0.85rem; font-weight: 500; }
  .lesson-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
  .lesson-action {
    font-size: 0.72rem;
    color: var(--color);
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .lesson-item:hover .lesson-action { opacity: 1; }

  /* ─── QUIZ CARD ─── */
  .quiz-card {
    background: linear-gradient(135deg, var(--surface) 0%, color-mix(in srgb, var(--accent-hist) 5%, var(--surface)) 100%);
    border: 1px solid var(--accent-hist);
    border-radius: var(--radius);
    padding: 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    margin-bottom: 32px;
  }
  .quiz-left { display: flex; align-items: center; gap: 16px; }
  .quiz-icon { font-size: 2.5rem; }
  .quiz-info h3 { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
  .quiz-info p { color: var(--text-dim); font-size: 0.85rem; }
  .btn-quiz {
    background: var(--accent-hist);
    color: var(--bg);
    border: none;
    padding: 12px 28px;
    border-radius: 100px;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-quiz:hover { transform: scale(1.05); box-shadow: 0 0 24px color-mix(in srgb, var(--accent-hist) 40%, transparent); }

  /* ─── LESSON MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(13,15,26,0.92);
    backdrop-filter: blur(8px);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    width: 100%;
    max-width: 820px;
    max-height: 90vh;
    overflow-y: auto;
    transform: translateY(20px) scale(0.97);
    transition: transform 0.3s;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-header {
    padding: 24px 28px 16px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .modal-title { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 700; }
  .modal-close {
    width: 36px; height: 36px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 1.1rem;
    transition: background 0.2s;
  }
  .modal-close:hover { background: var(--border); }

  /* ─── SLIDE VIEWER ─── */
  .slide-viewer {
    padding: 28px;
  }

  .slide-progress {
    display: flex; gap: 8px; margin-bottom: 24px;
  }
  .slide-dot {
    flex: 1; height: 4px; border-radius: 4px;
    background: var(--border);
    transition: background 0.3s;
    cursor: pointer;
  }
  .slide-dot.active { background: var(--accent-sci); }
  .slide-dot.done { background: color-mix(in srgb, var(--accent-sci) 50%, var(--border)); }

  .slide {
    min-height: 300px;
    display: none;
  }
  .slide.active { display: block; }

  .slide-type-title {
    text-align: center;
    padding: 40px 20px;
  }
  .slide-type-title .slide-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .slide-type-title h2 {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 12px;
    color: var(--accent-sci);
  }
  .slide-type-title p {
    color: var(--text-dim);
    font-size: 1rem;
    max-width: 400px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .slide-type-title .big-emoji { font-size: 4rem; margin-bottom: 20px; }

  .slide-type-content h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .slide-type-content .content-box {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 20px;
    margin-bottom: 16px;
    border-left: 3px solid var(--accent-sci);
  }
  .slide-type-content .content-box h4 {
    font-size: 0.85rem;
    font-family: 'DM Mono', monospace;
    color: var(--accent-sci);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .slide-type-content .content-box p, .slide-type-content .content-box ul {
    font-size: 0.92rem;
    color: var(--text);
    line-height: 1.7;
  }
  .slide-type-content .content-box ul { padding-left: 16px; }
  .slide-type-content .content-box li { margin-bottom: 4px; }

  .highlight-box {
    background: color-mix(in srgb, var(--accent-math) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent-math) 30%, transparent);
    border-radius: var(--radius-sm);
    padding: 16px 20px;
    margin: 16px 0;
  }
  .highlight-box .hl-label {
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    color: var(--accent-math);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .highlight-box p { font-size: 0.9rem; line-height: 1.6; }

  /* ─── PRACTICE AREA ─── */
  .practice-area {
    margin-top: 24px;
    padding: 24px;
    background: var(--surface2);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .practice-title {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .practice-title::before {
    content: '✏️';
  }

  .mcq-question {
    margin-bottom: 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .mcq-question:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .q-text {
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .q-num {
    display: inline-block;
    background: var(--accent-sci);
    color: var(--bg);
    width: 22px; height: 22px;
    border-radius: 50%;
    text-align: center;
    line-height: 22px;
    font-size: 0.75rem;
    font-weight: 700;
    margin-right: 8px;
    font-family: 'DM Mono', monospace;
  }
  .mcq-options { display: flex; flex-direction: column; gap: 8px; }
  .mcq-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.88rem;
  }
  .mcq-option:hover { border-color: var(--accent-sci); background: color-mix(in srgb, var(--accent-sci) 6%, var(--surface)); }
  .mcq-option.selected { border-color: var(--accent-sci); background: color-mix(in srgb, var(--accent-sci) 12%, var(--surface)); }
  .mcq-option.correct { border-color: #4caf50; background: color-mix(in srgb, #4caf50 12%, var(--surface)); }
  .mcq-option.wrong { border-color: var(--accent-eng); background: color-mix(in srgb, var(--accent-eng) 12%, var(--surface)); }
  .opt-letter {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .mcq-option.selected .opt-letter { background: var(--accent-sci); border-color: var(--accent-sci); color: var(--bg); }

  /* Writing practice */
  .writing-prompt {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-dim);
    font-style: italic;
  }
  .writing-area {
    width: 100%;
    min-height: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    line-height: 1.7;
    resize: vertical;
    transition: border-color 0.2s;
  }
  .writing-area:focus { outline: none; border-color: var(--accent-eng); }
  .writing-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  /* Fill in the blank */
  .fill-blank {
    font-size: 0.95rem;
    line-height: 2;
    margin-bottom: 16px;
  }
  .blank-input {
    display: inline-block;
    border: none;
    border-bottom: 2px solid var(--accent-eng);
    background: transparent;
    color: var(--accent-eng);
    font-family: 'DM Mono', monospace;
    font-size: 0.9rem;
    width: 120px;
    text-align: center;
    padding: 2px 4px;
    margin: 0 4px;
    transition: border-color 0.2s;
  }
  .blank-input:focus { outline: none; border-color: var(--white); }

  /* Math input */
  .math-problem {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    color: var(--accent-math);
    margin-bottom: 8px;
  }
  .math-input {
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    padding: 10px 14px;
    width: 160px;
    transition: border-color 0.2s;
  }
  .math-input:focus { outline: none; border-color: var(--accent-math); }

  /* Feedback */
  .feedback {
    display: none;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    margin-top: 12px;
    font-weight: 500;
  }
  .feedback.show { display: block; }
  .feedback.correct { background: color-mix(in srgb, #4caf50 15%, transparent); color: #81c784; border: 1px solid #4caf50; }
  .feedback.wrong { background: color-mix(in srgb, var(--accent-eng) 12%, transparent); color: var(--accent-eng); border: 1px solid var(--accent-eng); }

  /* Check button */
  .btn-check {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 100px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
  }
  .btn-check:hover { border-color: var(--accent-sci); color: var(--accent-sci); }

  /* ─── SLIDE NAVIGATION ─── */
  .slide-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
    border-top: 1px solid var(--border);
  }
  .btn-nav {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 24px;
    border-radius: 100px;
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-nav:hover { border-color: var(--accent-sci); }
  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-complete {
    background: var(--accent-sci);
    border-color: var(--accent-sci);
    color: var(--bg);
  }
  .btn-complete:hover { box-shadow: 0 0 20px color-mix(in srgb, var(--accent-sci) 40%, transparent); }
  .slide-counter {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  /* ─── QUIZ MODAL ─── */
  .quiz-header-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
  }
  .quiz-progress-info {
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

// ═══════════════════════════════════════════════════════════════
// APP STATE
// ═══════════════════════════════════════════════════════════════
let currentWeek = 1;
let completedLessons = JSON.parse(localStorage.getItem('completedLessons') || '{}');
let completedQuizzes = JSON.parse(localStorage.getItem('completedQuizzes') || '{}');
let currentLesson = null;
let currentSlideIdx = 0;
let quizAnswers = {};

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function renderWeek(week) {
  const data = CURRICULUM[week];
  const subjectOrder = ['english', 'science', 'math', 'history'];
  const subjectIcons = { english: '✍️', science: '🔬', math: '➗', history: '🏛️' };

  let html = `
    <div class="week-header">
      <div class="week-label">Week ${week} of 4</div>
      <div class="week-title">${data.title} — <span style="color:var(--text-dim);font-weight:400">${data.theme}</span></div>
    </div>
    <div class="subjects-grid">
  `;

  subjectOrder.forEach(subj => {
    const s = data.subjects[subj];
    const doneCount = s.lessons.filter((_, i) => completedLessons[`${week}-${subj}-${i}`]).length;
    const pct = Math.round((doneCount / s.lessons.length) * 100);
    const circumference = 2 * Math.PI * 16;
    const offset = circumference - (pct / 100) * circumference;

    let lessonsHtml = '';
    s.lessons.forEach((l, i) => {
      const isDone = completedLessons[`${week}-${subj}-${i}`];
      lessonsHtml += `
        <div class="lesson-item ${isDone ? 'done' : 'active'}" onclick="openLesson(${week}, '${subj}', ${i})">
          <div class="lesson-status">${isDone ? '✓' : ''}</div>
          <div class="lesson-info">
            <div class="lesson-name">${l.name}</div>
            <div class="lesson-meta">${l.type} · ~10 min · ${l.slides.length - 1} slides + practice</div>
          </div>
          <div class="lesson-action">Start →</div>
        </div>`;
    });

    html += `
      <div class="subject-card" data-subject="${subj}">
        <div class="card-top">
          <div class="card-icon">${subjectIcons[subj]}</div>
          <div class="card-progress-ring">
            <svg width="44" height="44" viewBox="0 0 44 44">
              <circle class="ring-bg" cx="22" cy="22" r="16" stroke-width="3" fill="none"/>
              <circle class="ring-fill" cx="22" cy="22" r="16" stroke-width="3" fill="none"
                stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/>
            </svg>
            <div class="ring-pct">${pct}%</div>
          </div>
        </div>
        <div class="card-body">
          <div class="card-subject-tag">${subj.toUpperCase()}</div>
          <div class="card-title">${s.title}</div>
          <div class="lessons-list">${lessonsHtml}</div>
        </div>
      </div>`;
  });

  html += `</div>`;

  const quizDone = completedQuizzes[week];
  const allLessonsDone = subjectOrder.every(s =>
    CURRICULUM[week].subjects[s].lessons.every((_, i) => completedLessons[`${week}-${s}-${i}`])
  );

  html += `
    <div class="quiz-card">
      <div class="quiz-left">
        <div class="quiz-icon">📝</div>
        <div class="quiz-info">
          <h3>Week ${week} Quiz${quizDone ? ' — Completed! 🎉' : ''}</h3>
          <p>${quizDone ? `Score: ${completedQuizzes[week].score}/${CURRICULUM[week].quiz.length} · Great work!` : (allLessonsDone ? 'All lessons done — ready for the quiz!' : 'Complete all lessons first, then take the weekly quiz')}</p>
        </div>
      </div>
      <button class="btn-quiz" onclick="openQuiz(${week})" ${!allLessonsDone && !quizDone ? 'style="opacity:0.5"' : ''}>
        ${quizDone ? 'Retake Quiz' : 'Take Quiz →'}
      </button>
    </div>`;

  document.getElementById('mainContent').innerHTML = html;
  updateProgress();
  updateWeekBadges();
}

function switchWeek(n) {
  currentWeek = n;
  document.querySelectorAll('.week-tab').forEach((t, i) => t.classList.toggle('active', i + 1 === n));
  renderWeek(n);
}

function updateProgress() {
  const total = Object.values(CURRICULUM).reduce((sum, w) =>
    sum + Object.values(w.subjects).reduce((s2, subj) => s2 + subj.lessons.length, 0), 0);
  const done = Object.keys(completedLessons).filter(k => completedLessons[k]).length;
  const pct = Math.round((done / total) * 100);
  document.getElementById('xpFill').style.width = pct + '%';
  document.getElementById('xpLabel').textContent = pct + '%';
}

function updateWeekBadges() {
  for (let w = 1; w <= 4; w++) {
    const subjectOrder = ['english', 'science', 'math', 'history'];
    const allDone = subjectOrder.every(s =>
      CURRICULUM[w].subjects[s].lessons.every((_, i) => completedLessons[`${w}-${s}-${i}`])
    );
    const tab = document.querySelectorAll('.week-tab')[w - 1];
    tab.classList.toggle('completed', allDone && completedQuizzes[w]);
  }
}

// ═══════════════════════════════════════════════════════════════
// LESSON MODAL
// ═══════════════════════════════════════════════════════════════
function openLesson(week, subj, idx) {
  currentLesson = { week, subj, idx };
  currentSlideIdx = 0;
  const lesson = CURRICULUM[week].subjects[subj].lessons[idx];
  document.getElementById('modalTitle').textContent = lesson.name;
  renderSlide();
  document.getElementById('lessonModal').classList.add('open');
}

function closeModal() {
  document.getElementById('lessonModal').classList.remove('open');
  renderWeek(currentWeek);
}

function renderSlide() {
  const lesson = CURRICULUM[currentLesson.week].currentLesson
    ? CURRICULUM[currentLesson.week].subjects[currentLesson.subj].lessons[currentLesson.idx]
    : CURRICULUM[currentLesson.week].subjects[currentLesson.subj].lessons[currentLesson.idx];
  
  const slides = lesson.slides;
  const total = slides.length;
  const slide = slides[currentSlideIdx];
  const isLast = currentSlideIdx === total - 1;

  // Progress dots
  let dotsHtml = '';
  slides.forEach((_, i) => {
    const cls = i < currentSlideIdx ? 'done' : i === currentSlideIdx ? 'active' : '';
    dotsHtml += `<div class="slide-dot ${cls}" onclick="goToSlide(${i})"></div>`;
  });

  let slideHtml = `<div class="slide-progress">${dotsHtml}</div>`;

  if (slide.type === 'title') {
    slideHtml += `
      <div class="slide slide-type-title active">
        <div class="big-emoji">${slide.emoji}</div>
        <div class="slide-num">Lesson ${currentLesson.idx + 1}</div>
        <h2>${slide.title}</h2>
        <p>${slide.sub}</p>
      </div>`;
  } else if (slide.type === 'content') {
    let contentHtml = '';
    slide.content.forEach(c => {
      contentHtml += `<div class="content-box" style="border-left-color:${slide.color}"><h4>${c.head}</h4><p>${c.text}</p></div>`;
    });
    if (slide.highlight) {
      contentHtml += `<div class="highlight-box"><div class="hl-label">${slide.highlight.label}</div><p>${slide.highlight.text}</p></div>`;
    }
    slideHtml += `<div class="slide slide-type-content active"><h3>${slide.title}</h3>${contentHtml}</div>`;
  } else if (slide.type === 'practice') {
    slideHtml += renderPractice(lesson.practice);
  }

  document.getElementById('modalBody').innerHTML = `<div class="slide-viewer">${slideHtml}</div>`;
  document.getElementById('slideCounter').textContent = `${currentSlideIdx + 1} / ${total}`;
  
  const btnNext = document.getElementById('btnNext');
  const btnPrev = document.getElementById('btnPrev');
  btnPrev.disabled = currentSlideIdx === 0;
  
  if (isLast) {
    btnNext.textContent = '✓ Complete Lesson';
    btnNext.className = 'btn-nav btn-complete';
  } else {
    btnNext.textContent = 'Next →';
    btnNext.className = 'btn-nav btn-complete';
  }
}

function goToSlide(i) {
  currentSlideIdx = i;
  renderSlide();
}

function nextSlide() {
  const lesson = CURRICULUM[currentLesson.week].subjects[currentLesson.subj].lessons[currentLesson.idx];
  if (currentSlideIdx < lesson.slides.length - 1) {
    currentSlideIdx++;
    renderSlide();
  } else {
    // Mark complete
    const key = `${currentLesson.week}-${currentLesson.subj}-${currentLesson.idx}`;
    completedLessons[key] = true;
    localStorage.setItem('completedLessons', JSON.stringify(completedLessons));
    closeModal();
  }
}

function prevSlide() {
  if (currentSlideIdx > 0) {
    currentSlideIdx--;
    renderSlide();
  }
}

function renderPractice(practice) {
  let html = '<div class="practice-area"><div class="practice-title">Practice Time</div>';
  
  practice.items.forEach((item, qi) => {
    if (item.type === 'mcq') {
      html += `<div class="mcq-question">
        <div class="q-text"><span class="q-num">${qi + 1}</span>${item.q}</div>
        <div class="mcq-options">`;
      const letters = ['A', 'B', 'C', 'D'];
      item.options.forEach((opt, oi) => {
        html += `<div class="mcq-option" onclick="selectAnswer(${qi}, ${oi}, ${item.correct})">
          <div class="opt-letter">${letters[oi]}</div>${opt}
        </div>`;
      });
      html += `</div><div class="feedback" id="feedback-${qi}"></div></div>`;
    } else if (item.type === 'writing') {
      const wordCount = `<span id="wc-${qi}">0</span> words`;
      html += `<div class="mcq-question">
        <div class="q-text"><span class="q-num">${qi + 1}</span>${item.prompt}</div>
        <div class="writing-prompt">Write your response below ↓</div>
        <textarea class="writing-area" placeholder="${item.placeholder || 'Write here...'}" oninput="countWords(this, ${qi})"></textarea>
        <div class="writing-footer"><span>${wordCount}</span><span style="color:var(--text-dim);font-size:0.75rem">✓ Your response is auto-saved as you type</span></div>
      </div>`;
    } else if (item.type === 'math') {
      html += `<div class="mcq-question">
        <div class="q-text"><span class="q-num">${qi + 1}</span></div>
        <div class="math-problem">${item.problem}</div>
        <input class="math-input" type="text" placeholder="Your answer" id="math-${qi}" />
        <button class="btn-check" onclick="checkMath(${qi}, '${item.answer}')">Check Answer</button>
        <div class="feedback" id="feedback-${qi}"></div>
      </div>`;
    } else if (item.type === 'fill') {
      const parts = item.sentence.split('___');
      let sentHtml = parts[0];
      item.blanks.forEach((b, bi) => {
        sentHtml += `<input class="blank-input" type="text" id="blank-${qi}-${bi}" placeholder="______" />`;
        if (parts[bi + 1]) sentHtml += parts[bi + 1];
      });
      html += `<div class="mcq-question">
        <div class="q-text"><span class="q-num">${qi + 1}</span>Fill in the blanks:</div>
        <div class="fill-blank">${sentHtml}</div>
        <button class="btn-check" onclick="checkBlanks(${qi}, ${JSON.stringify(item.blanks)})">Check Answers</button>
        <div class="feedback" id="feedback-${qi}"></div>
      </div>`;
    }
  });
  
  html += '</div>';
  return `<div class="slide slide-type-content active">${html}</div>`;
}

function selectAnswer(qi, selected, correct) {
  const opts = document.querySelectorAll(`.mcq-question:nth-child(${qi + 1}) .mcq-option`);
  opts.forEach((o, i) => {
    o.classList.remove('selected', 'correct', 'wrong');
    if (i === correct) o.classList.add('correct');
    else if (i === selected && selected !== correct) o.classList.add('wrong');
    else if (i === selected) o.classList.add('selected');
  });
  const fb = document.getElementById(`feedback-${qi}`);
  if (fb) {
    fb.className = `feedback show ${selected === correct ? 'correct' : 'wrong'}`;
    fb.textContent = selected === correct ? '✓ Correct! Well done!' : `✗ Not quite. The correct answer is highlighted in green.`;
  }
}

function checkMath(qi, correct) {
  const input = document.getElementById(`math-${qi}`);
  const val = input.value.trim().replace(/\s/g, '');
  const isCorrect = val === correct.replace(/\s/g, '') || parseFloat(val) === parseFloat(correct);
  const fb = document.getElementById(`feedback-${qi}`);
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.textContent = isCorrect ? `✓ Correct! The answer is ${correct}.` : `✗ Not quite. The correct answer is ${correct}. Try to work through the steps again!`;
}

function checkBlanks(qi, blanks) {
  let allCorrect = true;
  blanks.forEach((b, bi) => {
    const input = document.getElementById(`blank-${qi}-${bi}`);
    if (input && input.value.trim().toLowerCase() !== b.toLowerCase()) allCorrect = false;
  });
  const fb = document.getElementById(`feedback-${qi}`);
  fb.className = `feedback show ${allCorrect ? 'correct' : 'wrong'}`;
  fb.textContent = allCorrect ? '✓ All blanks correct!' : `✗ Not quite. Correct: ${blanks.join(', ')}`;
}

function countWords(el, qi) {
  const words = el.value.trim().split(/\s+/).filter(w => w).length;
  const wc = document.getElementById(`wc-${qi}`);
  if (wc) wc.textContent = words;
}

function openQuiz(week) {
  quizAnswers = {};
  const quiz = CURRICULUM[week].quiz;
  document.getElementById('quizTitle').textContent = `Week ${week} Quiz`;
  document.getElementById('quizScoreDisp').textContent = 'Score: 0';

  let html = '<div class="quiz-body">';
  quiz.forEach((q, qi) => {
    const letters = ['A', 'B', 'C', 'D'];
    let opts = '';
    q.options.forEach((opt, oi) => {
      opts += `<div class="mcq-option" onclick="answerQuiz(${week}, ${qi}, ${oi}, ${q.correct})">
        <div class="opt-letter">${letters[oi]}</div>${opt}
      </div>`;
    });
    html += `<div class="quiz-q" id="quiz-q-${qi}">
      <div class="q-subject-chip" style="background:color-mix(in srgb, ${q.color} 12%, transparent);color:${q.color}">${q.subject}</div>
      <div class="q-text"><span class="q-num">${qi + 1}</span>${q.q}</div>
      <div class="mcq-options" id="quiz-opts-${qi}">${opts}</div>
      <div class="feedback" id="quiz-fb-${qi}"></div>
    </div>`;
  });
  html += '</div>';

  document.getElementById('quizBody').innerHTML = html;
  document.getElementById('quizModal').classList.add('open');
}

function closeQuiz() {
  document.getElementById('quizModal').classList.remove('open');
}

let quizScore = 0;
function answerQuiz(week, qi, selected, correct) {
  if (quizAnswers[qi] !== undefined) return; // already answered
  quizAnswers[qi] = selected;

  const opts = document.querySelectorAll(`#quiz-opts-${qi} .mcq-option`);
  opts.forEach((o, i) => {
    if (i === correct) o.classList.add('correct');
    else if (i === selected && selected !== correct) o.classList.add('wrong');
  });
  const fb = document.getElementById(`quiz-fb-${qi}`);
  const isCorrect = selected === correct;
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.textContent = isCorrect ? '✓ Correct!' : `✗ Correct answer highlighted.`;

  // Check if all answered
  const total = CURRICULUM[week].quiz.length;
  const answered = Object.keys(quizAnswers).length;
  const score = Object.keys(quizAnswers).filter(k => quizAnswers[k] === CURRICULUM[week].quiz[k].correct).length;
  document.getElementById('quizScoreDisp').textContent = `Score: ${score}/${answered}`;

  if (answered === total) {
    completedQuizzes[week] = { score, total };
    localStorage.setItem('completedQuizzes', JSON.stringify(completedQuizzes));
    setTimeout(() => showQuizResults(week, score, total), 800);
  }
}

function showQuizResults(week, score, total) {
  const pct = Math.round((score / total) * 100);
  const msg = pct >= 90 ? '🏆 Excellent! You\'re ready for Grade 6!' :
               pct >= 70 ? '⭐ Great job! Keep reviewing weak areas.' :
               pct >= 50 ? '💪 Good effort! Review the lessons again.' :
               '📚 Keep studying — you\'ve got this!';

  const bySubject = ['English', 'Science', 'Math', 'History'].map(subj => {
    const subjectQs = CURRICULUM[week].quiz.filter(q => q.subject === subj);
    const subjectCorrect = subjectQs.filter((q, i) => {
      const realIdx = CURRICULUM[week].quiz.indexOf(q);
      return quizAnswers[realIdx] === q.correct;
    }).length;
    return { subj, correct: subjectCorrect, total: subjectQs.length };
  });

  let breakdownHtml = '';
  bySubject.forEach(s => {
    const color = s.subj === 'English' ? 'var(--accent-eng)' : s.subj === 'Science' ? 'var(--accent-sci)' : s.subj === 'Math' ? 'var(--accent-math)' : 'var(--accent-hist)';
    breakdownHtml += `<div class="breakdown-item">
      <div class="bi-label" style="color:${color}">${s.subj}</div>
      <div class="bi-val">${s.correct}/${s.total}</div>
    </div>`;
  });

  document.getElementById('quizBody').innerHTML = `
    <div class="results-view">
      <div class="results-label">Your Score</div>
      <div class="results-score">${pct}%</div>
      <div class="results-msg">${msg}</div>
      <div class="results-breakdown">${breakdownHtml}</div>
      <button class="btn-quiz" onclick="closeQuiz()" style="background:var(--accent-sci)">Back to Lessons →</button>
    </div>`;
}

renderWeek(1);
